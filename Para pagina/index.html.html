<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Candidatos 2026 - Elecciones Presidenciales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-header {
            background-color: #c10e16;
            padding: 15px 0;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: center;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            opacity: 0.8;
        }

        .header-voto-rojo {
            background: #c10e16;
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 18px 24px;
            margin: 25px 0 30px 0;
            border-radius: 28px;
            text-align: center;
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .candidate-card-mini {
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .candidate-card-mini:hover {
            transform: translateY(-5px);
            border-color: #c10e16;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card-img {
            position: relative;
            flex-shrink: 0;
        }

        .card-img img:first-child {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #c10e16;
        }

        .mini-party-icon {
            position: absolute;
            bottom: -5px;
            right: -8px;
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            padding: 2px;
        }

        .card-info-mini {
            flex: 1;
            padding-left: 16px;
        }

        .mini-name {
            font-weight: 800;
            font-size: 0.85rem;
            color: #1e3a4d;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .mini-party {
            font-weight: 600;
            font-size: 0.7rem;
            background: #f0f2f5;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            color: #c10e16;
        }

        .btn-volver {
            background: #4a5568;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            margin: 15px 0 25px;
            font-size: 1rem;
        }

        .btn-volver:hover {
            background: #c10e16;
            transform: translateX(-3px);
        }

        .candidate-card {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: white;
            border-radius: 32px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .candidate-photo {
            position: relative;
            text-align: center;
        }

        .candidate-photo img:first-child {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #c10e16;
        }

        .party-logo-overlay {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 2px solid white;
        }

        .party-logo-overlay img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 50%;
        }

        .candidate-info {
            flex: 1;
        }

        .candidate-info h1 {
            font-size: 1.5rem;
            color: #1e3b4f;
            margin-bottom: 8px;
        }

        .role {
            font-size: 1rem;
            color: #c10e16;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 24px;
        }

        .label {
            font-weight: 700;
            color: #2c5a7a;
        }

        .info-section {
            background: white;
            border-radius: 24px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: #f9fafc;
            cursor: pointer;
        }

        .section-header h2 {
            font-size: 1.2rem;
            margin: 0;
            color: #c10e16;
        }

        .section-header span {
            font-size: 1.7rem;
            font-weight: 400;
            color: #c10e16;
        }

        .section-content {
            display: none;
            padding: 18px 22px;
            border-top: 1px solid #e9edf2;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .data-table th, .data-table td {
            border: 1px solid #dee4ec;
            padding: 10px 8px;
            text-align: left;
        }

        .data-table th {
            background-color: #f1f5f9;
            font-weight: 700;
        }

        .sin-info {
            color: #5f7d9c;
            font-style: italic;
            padding: 10px 0;
        }

        @media (max-width: 700px) {
            .candidate-grid {
                grid-template-columns: 1fr;
            }
            .header-voto-rojo {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

    function cargarLista() {
        const grid = document.getElementById("candidatesGrid");
        grid.innerHTML = "";
        candidatosData.forEach(c => {
            const card = document.createElement("div");
            card.className = "candidate-card-mini";
            card.onclick = () => verDetalle(c.id);
            card.innerHTML = `
                <div class="card-img">
                    <img src="${c.foto}" onerror="this.src='https://placehold.co/75x75?text=No+Foto'">
                    <img src="${c.logo}" class="mini-party-icon" onerror="this.style.display='none'">
                </div>
                <div class="card-info-mini">
                    <p class="mini-name">${c.nombre}</p>
                    <p class="mini-party">${c.partido}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function verDetalle(id) {
        const c = candidatosData.find(c => c.id === id);
        if (!c) return;
        
        const uniHtml = c.universidad ? `<table class="data-table"><thead><tr><th>UNIVERSIDAD</th><th>CONCLUÍDO</th><th>GRADO</th><th>AÑO</th></tr></thead><tbody>${c.universidad.map(u => `<tr><td>${u.inst}</td><td>${u.concluido}</td><td>${u.grado}</td><td>${u.anio}</td></tr>`).join('')}</tbody></table>` : '<div class="sin-info">No registra</div>';
        
        const posgradoHtml = c.posgrado ? `<table class="data-table"><thead><tr><th>CENTRO</th><th>ESPECIALIDAD</th><th>CONCLUÍDO</th><th>GRADO</th><th>AÑO</th></tr></thead><tbody>${c.posgrado.map(p => `<tr><td>${p.centro}</td><td>${p.especialidad}</td><td>${p.concluido}</td><td>${p.grado}</td><td>${p.anio}</td></tr>`).join('')}</tbody><table>` : '<div class="sin-info">No registra</div>';
        
        document.getElementById("detalle-contenedor").innerHTML = `
            <section class="candidate-card">
                <div class="candidate-photo">
                    <img src="${c.foto}" onerror="this.src='https://placehold.co/160x160?text=Foto'">
                    <div class="party-logo-overlay"><img src="${c.logo}" onerror="this.style.display='none'"></div>
                </div>
                <div class="candidate-info">
                    <h1>${c.nombre}</h1>
                    <p class="role">Cargo al que postula: <strong>PRESIDENTE</strong></p>
                    <div class="details-grid">
                        <div><span class="label">Profesión:</span> ${c.profesion}</div>
                        <div><span class="label">Nacimiento:</span> ${c.nacimiento}</div>
                        <div><span class="label">DNI:</span> [Protegido]</div>
                        <div><span class="label">Domicilio:</span> ${c.domicilio}</div>
                        <div><span class="label">Sexo:</span> ${c.sexo}</div>
                    </div>
                </div>
            </section>
            <div class="info-section"><div class="section-header" onclick="toggleSeccion(this)"><h2>EDUCACIÓN BÁSICA</h2><span>+</span></div><div class="section-content"><div class="sin-info">${c.educacion_basica}</div></div></div>
            <div class="info-section"><div class="section-header" onclick="toggleSeccion(this)"><h2>ESTUDIOS TÉCNICOS</h2><span>+</span></div><div class="section-content"><div class="sin-info">${c.estudios_tecnicos || "No registra"}</div></div></div>
            <div class="info-section"><div class="section-header" onclick="toggleSeccion(this)"><h2>ESTUDIOS NO UNIVERSITARIOS</h2><span>+</span></div><div class="section-content"><div class="sin-info">${c.estudios_no_univ || "No registra"}</div></div></div>
            <div class="info-section"><div class="section-header" onclick="toggleSeccion(this)"><h2>ESTUDIOS UNIVERSITARIOS</h2><span>+</span></div><div class="section-content">${uniHtml}</div></div>
            <div class="info-section"><div class="section-header" onclick="toggleSeccion(this)"><h2>ESTUDIOS DE POSGRADO</h2><span>+</span></div><div class="section-content">${posgradoHtml}</div></div>
        `;
        
        document.getElementById("lista").style.display = "none";
        document.getElementById("detalle").style.display = "block";
        window.scrollTo({ top: 0 });
    }

    function volverALista() {
        document.getElementById("lista").style.display = "block";
        document.getElementById("detalle").style.display = "none";
    }

    function toggleSeccion(header) {
        const content = header.nextElementSibling;
        if (content.style.display === "block") {
            content.style.display = "none";
            header.querySelector("span").innerHTML = "+";
        } else {
            content.style.display = "block";
            header.querySelector("span").innerHTML = "−";
        }
    }

    cargarLista();
</script>

</body>
</html>
